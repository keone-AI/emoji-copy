<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>콕콕티콘 · 누르면 바로 복사되는 이모지</title>
  <meta name="description" content="이모지와 특수 이모티콘을 콕 누르면 바로 복사돼요. 광고 없음.">
  <meta name="theme-color" content="#FFE4EC">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='5' width='34' height='31' rx='13' fill='%23FF8FB3'/%3E%3Cellipse cx='14.5' cy='20' rx='2.4' ry='3' fill='%234B2E35'/%3E%3Cellipse cx='25.5' cy='20' rx='2.4' ry='3' fill='%234B2E35'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
  <meta name="apple-mobile-web-app-title" content="콕콕티콘">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="top" id="top">
    <div class="top-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="3" y="6" width="34" height="30" rx="13" fill="var(--mark)"/>
          <ellipse cx="11" cy="12.5" rx="4.5" ry="2.2" fill="#fff" opacity=".55"/>
          <ellipse cx="14.5" cy="20.5" rx="2.3" ry="2.9" fill="var(--mark-ink)"/>
          <ellipse cx="25.5" cy="20.5" rx="2.3" ry="2.9" fill="var(--mark-ink)"/>
          <path d="M17.6 25.4q2.4 2.3 4.8 0" stroke="var(--mark-ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="10" cy="25.5" rx="2.6" ry="1.5" fill="var(--mark-cheek)"/>
          <ellipse cx="30" cy="25.5" rx="2.6" ry="1.5" fill="var(--mark-cheek)"/>
          <path d="M34 1.5l1.1 2.7 2.7 1.1-2.7 1.1L34 9.1l-1.1-2.7-2.7-1.1 2.7-1.1z" fill="var(--accent)"/>
        </svg>
        <div class="brand-text">
          <h1 class="brand-name">콕콕티콘</h1>
          <p class="brand-sub">콕 누르면 바로 복사돼요</p>
        </div>
      </div>
      <button class="compose-toggle" id="composeToggle" type="button" aria-pressed="false" aria-controls="composer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        <span>모아쓰기</span>
      </button>
    </div>
  </header>

  <div class="sticky" id="sticky">
    <div class="sticky-inner">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="검색해 보세요 (예: 하트, 곰, 웃음)" aria-label="이모지·이모티콘 검색">
        <button class="search-clear" id="qClear" type="button" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </label>
      <nav class="cats" id="cats" aria-label="분류 바로가기"></nav>
    </div>
  </div>

  <main class="main" id="main">
    <div class="panel" id="panel-recent" data-tab="recent" hidden></div>
    <div class="panel" id="panel-emoji" data-tab="emoji" hidden></div>
    <div class="panel" id="panel-kaomoji" data-tab="kaomoji" hidden></div>
    <div class="panel" id="panel-symbol" data-tab="symbol" hidden></div>
    <div class="panel" id="panel-search" hidden></div>
  </main>

  <div class="composer" id="composer" hidden>
    <input id="composeInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="콕콕 눌러서 이어 붙여요" aria-label="모아쓰기 칸">
    <button class="composer-clear" id="composeClear" type="button" aria-label="모아쓴 글 지우기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
    <button class="btn-primary" id="composeCopy" type="button">전체 복사</button>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="보기 전환">
    <button type="button" class="tab" data-tab="recent">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>최근</span>
    </button>
    <button type="button" class="tab" data-tab="emoji">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.6 14.3c1.9 2.1 4.9 2.1 6.8 0"/><circle class="dot" cx="9.2" cy="10" r="1.1"/><circle class="dot" cx="14.8" cy="10" r="1.1"/></svg>
      <span>이모지</span>
    </button>
    <button type="button" class="tab" data-tab="kaomoji">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4C4.2 6.1 3 8.8 3 12s1.2 5.9 3.5 8"/><path d="M17.5 4C19.8 6.1 21 8.8 21 12s-1.2 5.9-3.5 8"/><path d="M8 11.2l1.6-2 1.6 2"/><path d="M12.8 11.2l1.6-2 1.6 2"/><path d="M10.2 15h3.6"/></svg>
      <span>이모티콘</span>
    </button>
    <button type="button" class="tab" data-tab="symbol">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8z"/></svg>
      <span>특수문자</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <p class="sheet-title" id="sheetTitle">길게 눌러서 복사해 주세요</p>
      <p class="sheet-desc">이 브라우저는 자동 복사를 막고 있어요. 아래 글자를 길게 눌러 ‘복사’를 골라 주세요.</p>
      <textarea id="sheetText" readonly rows="2"></textarea>
      <button class="btn-primary sheet-close" id="sheetClose" type="button">닫기</button>
    </div>
  </div>

  <script src="data/emoji.js"></script>
  <script src="data/kaomoji.js"></script>
  <script src="data/symbols.js"></script>
  <script src="app.js"></script>
</body>
</html>
